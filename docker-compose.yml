services:

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    networks: [private-net]
    volumes:
      - db_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"        # solo pgadmin es accesible desde el host
    networks: [private-net]
    depends_on:
      - db
    volumes:      
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks: [public-net, private-net]
    depends_on:
      - db
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks: [public-net] 
    volumes:
      - ./frontend:/usr/share/nginx/html

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge

volumes:
  db_data:
  pgadmin_data: