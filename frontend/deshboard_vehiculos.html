<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fleet Management | Executive Kinetic</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="/styles/index.css" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#a5bdff",
                    "outline-variant": "#c3c6d5",
                    "on-tertiary-fixed": "#341100",
                    "error-container": "#ffdad6",
                    "surface-tint": "#2559bd",
                    "inverse-surface": "#2d3133",
                    "surface-container-highest": "#e0e3e5",
                    "surface-container-high": "#e6e8ea",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#546067",
                    "outline": "#737784",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#7a3000",
                    "surface-bright": "#f8f9fb",
                    "primary-fixed-dim": "#b1c5ff",
                    "on-surface-variant": "#434653",
                    "on-error-container": "#93000a",
                    "surface-dim": "#d8dadc",
                    "on-background": "#191c1e",
                    "background": "#f8f9fb",
                    "on-primary-fixed-variant": "#00419e",
                    "tertiary-container": "#843500",
                    "surface-container": "#eceef0",
                    "secondary-fixed-dim": "#bbc8d0",
                    "inverse-primary": "#b1c5ff",
                    "secondary-container": "#d7e4ec",
                    "on-secondary-fixed-variant": "#3c494f",
                    "on-error": "#ffffff",
                    "primary-fixed": "#dae2ff",
                    "on-tertiary-container": "#ffaa80",
                    "primary-container": "#0047ab",
                    "surface": "#f8f9fb",
                    "on-surface": "#191c1e",
                    "tertiary-fixed": "#ffdbcb",
                    "on-secondary-fixed": "#111d23",
                    "on-secondary-container": "#5a666d",
                    "secondary-fixed": "#d7e4ec",
                    "surface-container-low": "#f2f4f6",
                    "tertiary": "#602400",
                    "on-primary-fixed": "#001946",
                    "tertiary-fixed-dim": "#ffb692",
                    "surface-variant": "#e0e3e5",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "primary": "#00327d"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface text-on-surface">
<div id="header-placeholder"></div>
<div id="sidebar-placeholder"></div>
<!-- Main Content -->
<main class="ml-64 pt-24 px-8 pb-8 bg-surface min-h-screen">
<!-- Header Section -->
<section class="mb-10 flex justify-between items-end">
<div>
<h1 class="text-4xl font-extrabold tracking-tight text-on-background mb-2">Gestión de Flota</h1>
<p class="text-on-surface-variant body-md font-medium">Manejar el inventario de vehículos y su estado.</p>
</div>
<a href="/index_registrar_vehiculo.html" class="bg-gradient-to-br from-primary to-primary-container text-white px-6 py-3 rounded-lg font-semibold flex items-center gap-2 shadow-sm hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Registrar Nuevo Vehículo
            </a>
</section>
<!-- Quick Stats -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
<div class="bg-surface-container-lowest p-6 rounded-xl border-l-4 border-primary">
<p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Vehiculos totales</p>
<div class="flex items-baseline gap-2">
<span id="stats-total-vehicles" class="text-3xl font-headline font-bold text-on-surface">0</span>
</div>
</div>
<div class="bg-surface-container-lowest p-6 rounded-xl border-l-4 border-tertiary">
<p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Activos</p>
<div class="flex items-baseline gap-2">
<span id="stats-active-vehicles" class="text-3xl font-headline font-bold text-on-surface">0</span>
</div>
</div>
<div class="bg-surface-container-lowest p-6 rounded-xl border-l-4 border-secondary">
<p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Vehiculos de Socios</p>
<div class="flex items-baseline gap-2">
<span id="stats-maintenance-vehicles" class="text-3xl font-headline font-bold text-on-surface">0</span>
</div>
</div>
</section>
<!-- Filters Grid -->
<section class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-8 bg-surface-container-low p-6 rounded-xl">
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-secondary">Marca</label>
<select id="vehicle-brand-filter" class="w-full bg-surface-container-lowest border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary">
<option value="all">Todas</option>
</select>
</div>
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-secondary">Estado</label>
<select id="vehicle-status-filter" class="w-full bg-surface-container-lowest border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary">
<option value="all">Todos</option>
<option value="activo">Activo</option>
<option value="inactivo">Inactivo</option>
<option value="en validacion">En validacion</option>
<option value="rechazado">Rechazado</option>
<option value="alquilado">Alquilado</option>
<option value="en taller">En Taller</option>
</select>
</div>
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-secondary">Año</label>
<select id="vehicle-year-filter" class="w-full bg-surface-container-lowest border-none rounded-lg text-sm py-2.5 focus:ring-2 focus:ring-primary">
<option value="all">Todos</option>
</select>
</div>
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-secondary">Patente o modelo</label>
<div class="flex items-center bg-surface-container-lowest rounded-lg px-4 py-2.5 group transition-all focus-within:ring-2 ring-primary/20">
<span class="material-symbols-outlined text-slate-400 text-lg mr-2">search</span>
<input id="vehicle-search-input" class="bg-transparent border-none focus:ring-0 text-sm w-full placeholder:text-slate-400" placeholder="Buscar..." type="text"/>
</div>
</div>
<div class="flex items-end">
<button id="reset-vehicle-filters-btn" class="w-full bg-secondary-container text-on-secondary-container py-2.5 rounded-lg font-semibold flex items-center justify-center gap-2 hover:bg-slate-200 transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="filter_list">filter_list</span>
                    Reset Filters
                </button>
</div>
</section>
<!-- Data Table Card -->
<div class="bg-surface-container-lowest rounded-xl overflow-hidden">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-surface-container-low text-secondary uppercase text-[10px] font-extrabold tracking-widest">
<th class="px-6 py-4">Modelo</th>
<th class="px-6 py-4 text-center">Patente</th>
<th class="px-6 py-4">Marca</th>
<th class="px-6 py-4">Año</th>
<th class="px-6 py-4">Status</th>
</tr>
</thead>
<tbody id="vehicles-table-body" class="divide-y divide-surface-container">
</tbody>
</table>
<!-- Pagination -->
<div class="px-8 py-6 bg-surface-container-low/20 flex justify-between items-center border-t border-outline-variant/5">
<p id="vehicles-summary-label" class="text-xs text-slate-500 font-medium">Mostrando 0 vehículos</p>
<div></div>
</div>
</div>
</main>
<div id="footer-placeholder"></div>
<div id="login-modal-placeholder"></div>
<script src="/components/layout.js"></script>
</body></html>
