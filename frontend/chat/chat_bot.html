  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .chat-content p { margin-bottom: 0.5rem; }
    .chat-content p:last-child { margin-bottom: 0; }
    .chat-content strong { font-weight: 600; }
    .chat-content ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .chat-content ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .chat-content li { margin-bottom: 0.25rem; }
    .chat-content li:last-child { margin-bottom: 0; }
    .chat-content code { background: #eceef0; border-radius: 4px; padding: 0.1em 0.35em; font-size: 0.85em; font-family: monospace; }
  </style>
</head>
<body class="bg-surface font-body text-on-surface">

<div id="header-placeholder"></div>
<div id="sidebar-placeholder"></div>

<!-- TopAppBar -->
<header class="fixed top-20 left-64 right-0 z-40 bg-surface/70 backdrop-blur-xl flex justify-between items-center px-8 h-16">
  <div class="flex items-center gap-3">
    <a href="/chat/select_topic_chat.html" class="p-1.5 rounded-lg hover:bg-surface-container transition-colors text-secondary">
      <span class="material-symbols-outlined">arrow_back</span>
    </a>
    <h2 class="font-headline text-lg tracking-tight font-bold text-primary" id="chat-topic-title">Chat de Soporte</h2>
  </div>
  <div class="flex items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
    <span class="text-xs font-medium text-secondary uppercase tracking-wider">Asistente Virtual · 24/7</span>
  </div>
</header>

<!-- Chat Canvas: ocupa todo el espacio restante bajo el TopAppBar -->
<div class="ml-64 pt-36 flex flex-col" style="height: 100vh;">

  <!-- Chat Area -->
  <div class="flex-1 overflow-y-auto px-8 py-6 space-y-8 hide-scrollbar bg-surface-container-low" id="chat-messages">

    <div class="flex justify-center">
      <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-secondary opacity-60" id="chat-date-label">Hoy</span>
    </div>

    <!-- Mensaje inicial del agente -->
    <div class="flex gap-4 max-w-[80%]" id="welcome-message">
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 self-end">
        <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">support_agent</span>
      </div>
      <div class="space-y-2">
        <div class="bg-surface-container-lowest p-5 rounded-xl rounded-bl-none shadow-sm border border-outline-variant/10">
          <p class="text-sm leading-relaxed text-on-surface" id="welcome-text">
            ¡Hola! Soy el asistente virtual de GoVehiculos. Voy a intentar resolver tu consulta. Si no puedo ayudarte, te derivo con un operador. ¿En qué puedo ayudarte?
          </p>
        </div>
        <span class="text-[10px] text-secondary ml-1" id="welcome-time"></span>
      </div>
    </div>

  </div>

  <!-- Message Input Area -->
  <footer class="px-8 py-5 bg-surface-container-lowest border-t border-outline-variant/10">
    <div class="max-w-4xl mx-auto flex items-end gap-4">
      <div class="flex-1 bg-surface-container-high rounded-xl p-2 focus-within:bg-white transition-all border border-transparent focus-within:border-primary-fixed/50 shadow-sm flex items-end">
        <button class="p-3 text-secondary hover:text-primary transition-colors">
          <span class="material-symbols-outlined">add_circle</span>
        </button>
        <textarea
          id="chat-input"
          class="flex-1 bg-transparent border-none focus:ring-0 text-sm py-3 px-2 resize-none max-h-32 hide-scrollbar font-body"
          placeholder="Escribí tu consulta..."
          rows="1"
        ></textarea>
      </div>
      <div class="flex items-center gap-3">
        <button id="request-human-btn" title="Hablar con una persona" class="px-3 py-2 rounded-lg border border-outline-variant/10 text-sm text-secondary hover:bg-surface-container-lowest">Hablar con persona</button>
        <button
          id="send-btn"
          class="kinetic-gradient w-14 h-14 rounded-xl flex items-center justify-center text-white shadow-lg hover:opacity-90 active:scale-90 transition-all"
        >
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
        </button>
      </div>
    </div>
    <div class="mt-3 flex justify-center gap-6">
      <span class="text-[10px] text-slate-400 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">lock</span>
        Sesión cifrada
      </span>
      <span class="text-[10px] text-slate-400 flex items-center gap-1">
        <span class="material-symbols-outlined text-[14px]">timer</span>
        Sesión activa
      </span>
    </div>
  </footer>

</div>

<div id="login-modal-placeholder"></div>

<script>
  const API_BASE = typeof API_BASE_URL !== 'undefined' ? API_BASE_URL : 'http://localhost:8000';

  let conversacionId = null;
  let promptKey = null;
  const renderedMessageIds = new Set();
  const pendingOwnMessages = [];

  function getToken() {
    return localStorage.getItem('auth_token');
  }

  function getNow() {
    return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  function getAuthUserInitials() {
    try {
      const user = JSON.parse(localStorage.getItem('auth_user') || '{}');
      return [user.nombre, user.apellido]
        .map(p => (p || '').charAt(0).toUpperCase())
        .filter(Boolean)
        .join('') || 'YO';
    } catch {
      return 'YO';
    }
  }

  function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function appendMessage(text, isUser, messageId = null) {
    if (messageId !== null && renderedMessageIds.has(String(messageId))) {
      return;
    }
    if (messageId !== null) {
      renderedMessageIds.add(String(messageId));
    }

    const container = document.getElementById('chat-messages');
    const wrapper = document.createElement('div');

    if (isUser) {
      const initials = getAuthUserInitials();
      wrapper.className = 'flex flex-row-reverse gap-4 max-w-[80%] ml-auto';
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full kinetic-gradient flex items-center justify-center self-end shadow-md flex-shrink-0">
          <span class="text-[10px] font-bold text-white">${initials}</span>
        </div>
        <div class="space-y-2 text-right">
          <div class="kinetic-gradient p-5 rounded-xl rounded-br-none shadow-lg">
            <p class="text-sm leading-relaxed text-white">${escapeHtml(text)}</p>
          </div>
          <span class="text-[10px] text-secondary mr-1">${getNow()}</span>
        </div>
      `;
    } else {
      const renderedText = typeof marked !== 'undefined' ? marked.parse(text) : escapeHtml(text);
      wrapper.className = 'flex gap-4 max-w-[80%]';
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 self-end">
          <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">support_agent</span>
        </div>
        <div class="space-y-2">
          <div class="bg-surface-container-lowest p-5 rounded-xl rounded-bl-none shadow-sm border border-outline-variant/10">
            <div class="chat-content text-sm leading-relaxed text-on-surface">${renderedText}</div>
          </div>
          <span class="text-[10px] text-secondary ml-1">${getNow()}</span>
        </div>
      `;
    }

    container.appendChild(wrapper);
    container.scrollTop = container.scrollHeight;
  }

  function rememberOwnMessage(text) {
    pendingOwnMessages.push({ text, createdAt: Date.now() });
  }

  function shouldSkipOwnEcho(text) {
    const now = Date.now();
    const index = pendingOwnMessages.findIndex((message) => {
      return message.text === text && now - message.createdAt < 15000;
    });

    if (index === -1) return false;
    pendingOwnMessages.splice(index, 1);
    return true;
  }

  function appendTypingIndicator() {
    const container = document.getElementById('chat-messages');
    const indicator = document.createElement('div');
    indicator.id = 'typing-indicator';
    indicator.className = 'flex gap-4 max-w-[80%]';
    indicator.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-primary-fixed flex items-center justify-center flex-shrink-0 self-end">
        <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">support_agent</span>
      </div>
      <div class="bg-surface-container-lowest px-5 py-4 rounded-xl rounded-bl-none shadow-sm border border-outline-variant/10 flex items-center gap-1">
        <span class="w-2 h-2 bg-secondary rounded-full animate-bounce" style="animation-delay:0ms"></span>
        <span class="w-2 h-2 bg-secondary rounded-full animate-bounce" style="animation-delay:150ms"></span>
        <span class="w-2 h-2 bg-secondary rounded-full animate-bounce" style="animation-delay:300ms"></span>
      </div>
    `;
    container.appendChild(indicator);
    container.scrollTop = container.scrollHeight;
  }

  async function requestHuman() {
    if (!conversacionId) {
      appendMessage('No hay una conversación activa. Por favor, envía un mensaje primero.', false);
      return;
    }
    const handoffText = 'Quiero hablar con una persona, por favor.';
    appendMessage(handoffText, true, `local-${Date.now()}`);
    rememberOwnMessage(handoffText);
    setSendingState(true);
    appendTypingIndicator();
    try {
      const res = await fetch(`${API_BASE}/chat/mensaje`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`,
        },
        body: JSON.stringify({
          conversacion_id: conversacionId,
          pregunta: handoffText,
          prompt_key: promptKey,
        }),
      });
      removeTypingIndicator();
      if (!res.ok) throw new Error('Error al solicitar soporte humano');
      const data = await res.json();
      appendMessage(data.cuerpo, false, data.id);
      if (data.requiere_soporte) {
        try { sessionStorage.setItem('support_chat_conversation_id', String(data.conversacion_id)); } catch (e) {}
        const redirectTo = data.redireccionar_a || `/chat_soporte.html?conversation_id=${data.conversacion_id}`;
        setTimeout(() => { window.location.href = redirectTo; }, 800);
      }
    } catch (err) {
      removeTypingIndicator();
      appendMessage('No se pudo solicitar la derivación. Intentá nuevamente.', false);
    } finally {
      setSendingState(false);
    }
  }

  function removeTypingIndicator() {
    document.getElementById('typing-indicator')?.remove();
  }

  function setSendingState(isSending) {
    const btn = document.getElementById('send-btn');
    const input = document.getElementById('chat-input');
    btn.disabled = isSending;
    input.disabled = isSending;
    btn.classList.toggle('opacity-50', isSending);
    btn.classList.toggle('cursor-not-allowed', isSending);
  }

  async function iniciarConversacion(key) {
    const res = await fetch(`${API_BASE}/chat/iniciar`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken()}`,
      },
      body: JSON.stringify({ prompt_key: key }),
    });
    if (!res.ok) throw new Error('No se pudo iniciar la conversación');
    const data = await res.json();
    conversacionId = data.conversacion_id;
    connectWebsocket(conversacionId);
  }

  let ws = null;
  function connectWebsocket(conversacionId) {
    try {
      const token = getToken();
      const apiUrl = new URL(API_BASE, window.location.origin);
      apiUrl.protocol = apiUrl.protocol === 'https:' ? 'wss:' : 'ws:';
      apiUrl.pathname = `/chat/ws/${conversacionId}`;
      apiUrl.search = `?token=${encodeURIComponent(token)}`;
      const url = apiUrl.toString();
      ws = new WebSocket(url);
      ws.onmessage = (evt) => {
        try {
          const data = JSON.parse(evt.data);
          const currentUserId = JSON.parse(localStorage.getItem('auth_user') || '{}').id;
          const isUser = Number(data.autor_id) === Number(currentUserId);
          if (isUser && shouldSkipOwnEcho(data.cuerpo)) {
            if (data.id !== null && data.id !== undefined) {
              renderedMessageIds.add(String(data.id));
            }
            return;
          }
          appendMessage(data.cuerpo, isUser, data.id);
        } catch (e) {
          console.error('WS parse', e);
        }
      };
      ws.onopen = () => console.debug('ws open');
      ws.onclose = () => console.debug('ws closed');
    } catch (e) {
      console.warn('WS failed', e);
    }
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !conversacionId) return;

    appendMessage(text, true, `local-${Date.now()}`);
    rememberOwnMessage(text);
    input.value = '';
    input.style.height = 'auto';

    setSendingState(true);
    appendTypingIndicator();

    try {
      const res = await fetch(`${API_BASE}/chat/mensaje`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${getToken()}`,
        },
        body: JSON.stringify({
          conversacion_id: conversacionId,
          pregunta: text,
          prompt_key: promptKey,
        }),
      });

      removeTypingIndicator();

      if (!res.ok) throw new Error('Error al obtener respuesta del asistente');

      const data = await res.json();
      appendMessage(data.cuerpo, false, data.id);

      if (data.requiere_soporte) {
        try {
          sessionStorage.setItem('support_chat_conversation_id', String(data.conversacion_id));
        } catch (e) {
          // ignore
        }
        const redirectTo = data.redireccionar_a || `/chat_soporte.html?conversation_id=${data.conversacion_id}`;
        setTimeout(() => {
          window.location.href = redirectTo;
        }, 900);
      }
    } catch (err) {
      removeTypingIndicator();
      appendMessage('Ocurrió un error al contactar al asistente. Por favor, intentá nuevamente.', false);
    } finally {
      setSendingState(false);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const topic = params.get('topic');
    promptKey = params.get('key');

    if (topic) {
      document.getElementById('chat-topic-title').textContent = topic;
      document.getElementById('welcome-text').textContent =
        `¡Hola! Soy el asistente virtual de GoVehiculos. Voy a ayudarte con "${topic}". Si no puedo resolver tu consulta, te derivo con un operador. ¿Qué necesitás?`;
    }

    document.getElementById('welcome-time').textContent = getNow();

    if (promptKey) {
      try {
        await iniciarConversacion(promptKey);
      } catch (err) {
        console.error('[chat] iniciarConversacion falló:', err);
        appendMessage('No se pudo iniciar la sesión de chat. Recargá la página e intentá nuevamente.', false);
      }
    }

    const sendBtn = document.getElementById('send-btn');
    const input = document.getElementById('chat-input');
    const requestHumanBtn = document.getElementById('request-human-btn');

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 128) + 'px';
    });
    requestHumanBtn.addEventListener('click', requestHuman);
  });
</script>
