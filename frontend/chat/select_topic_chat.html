<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>GoVehiculos | Soporte</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="/styles/index.css" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-fixed-dim": "#ffb692",
            "on-tertiary-fixed": "#341100",
            "primary": "#00327d",
            "on-secondary-container": "#5a666d",
            "on-primary-fixed": "#001946",
            "inverse-on-surface": "#eff1f3",
            "outline": "#737784",
            "on-background": "#191c1e",
            "tertiary-container": "#843500",
            "surface-container-lowest": "#ffffff",
            "secondary-fixed": "#d7e4ec",
            "surface": "#f8f9fb",
            "on-primary-fixed-variant": "#00419e",
            "error": "#ba1a1a",
            "surface-container": "#eceef0",
            "surface-dim": "#d8dadc",
            "outline-variant": "#c3c6d5",
            "error-container": "#ffdad6",
            "tertiary-fixed": "#ffdbcb",
            "on-secondary-fixed": "#111d23",
            "inverse-primary": "#b1c5ff",
            "on-secondary-fixed-variant": "#3c494f",
            "on-tertiary": "#ffffff",
            "surface-container-high": "#e6e8ea",
            "secondary": "#546067",
            "on-tertiary-fixed-variant": "#7a3000",
            "secondary-fixed-dim": "#bbc8d0",
            "on-tertiary-container": "#ffaa80",
            "surface-variant": "#e0e3e5",
            "primary-fixed-dim": "#b1c5ff",
            "on-error-container": "#93000a",
            "primary-container": "#0047ab",
            "on-surface": "#191c1e",
            "on-secondary": "#ffffff",
            "tertiary": "#602400",
            "surface-tint": "#2559bd",
            "surface-container-low": "#f2f4f6",
            "surface-container-highest": "#e0e3e5",
            "primary-fixed": "#dae2ff",
            "on-primary-container": "#a5bdff",
            "on-primary": "#ffffff",
            "inverse-surface": "#2d3133",
            "surface-bright": "#f8f9fb",
            "background": "#f8f9fb",
            "on-surface-variant": "#434653",
            "secondary-container": "#d7e4ec",
            "on-error": "#ffffff"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "fontFamily": {
            "headline": ["Manrope"],
            "body": ["Inter"],
            "label": ["Inter"]
          }
        }
      }
    }
  </script>
  <style>
    .active-topic {
      background-color: theme('colors.primary-fixed') !important;
      border-left-color: theme('colors.primary') !important;
    }
    .active-topic .topic-icon {
      background: linear-gradient(135deg, #00327d 0%, #0047ab 100%);
    }
  </style>
</head>
<body class="bg-surface font-body text-on-surface">

<div id="header-placeholder"></div>
<div id="sidebar-placeholder"></div>

<!-- TopAppBar -->
<header class="fixed top-20 left-64 right-0 z-40 bg-surface/70 backdrop-blur-xl flex justify-between items-center px-8 h-16">
  <div class="flex items-center gap-4">
    <h2 class="font-headline text-lg tracking-tight font-bold text-primary">Soporte</h2>
  </div>
</header>

<!-- Main Content Canvas -->
<main class="ml-64 pt-36 px-8 pb-8 min-h-screen">
  <div class="max-w-5xl mx-auto">

    <!-- Header Section -->
    <header class="mb-6">
      <h1 class="font-headline text-2xl font-extrabold text-on-background tracking-tight">Seleccioná un tema</h1>
    </header>

    <!-- Topic Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-5">

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Reservas y Alquileres">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">calendar_month</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Reservas y Alquileres</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Modificá fechas, confirmá reservas o consultá disponibilidad.</p>
      </button>

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Vehículos y Flota">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">directions_car</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Vehículos y Flota</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Especificaciones, características técnicas o categorías.</p>
      </button>

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Pagos y Facturación">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">payments</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Pagos y Facturación</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Revisá facturas, gestioná métodos de pago o comprobantes.</p>
      </button>

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Cuenta y Seguridad">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">lock</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Cuenta y Seguridad</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Verificación de identidad, contraseña y membresía.</p>
      </button>

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Problemas Técnicos">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">engineering</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Problemas Técnicos</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Inconvenientes con la plataforma o la aplicación móvil.</p>
      </button>

      <button class="topic-card text-left p-4 bg-surface-container-lowest rounded-xl border-l-4 border-primary/30 hover:border-primary shadow-sm hover:shadow-md transition-all duration-200 group" onclick="selectTopic(this)" data-topic="Seguros y Seguridad Vial">
        <div class="topic-icon w-9 h-9 bg-primary text-white rounded-full flex items-center justify-center mb-3">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">verified_user</span>
        </div>
        <h3 class="font-headline font-bold text-sm text-on-surface mb-1">Seguros y Seguridad Vial</h3>
        <p class="text-xs text-on-surface-variant leading-snug">Emergencias, cobertura y normativas de seguridad.</p>
      </button>

    </div>

    <!-- Acción y Ayuda Rápida -->
    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <div class="flex-1 w-full flex items-center gap-4">
        <button
          class="px-8 py-3 bg-outline-variant text-on-primary-container opacity-50 cursor-not-allowed rounded-xl font-bold text-sm transition-all duration-500"
          disabled
          id="startChatBtn"
        >
          Iniciar Conversación
        </button>
        <p class="text-xs text-secondary font-medium" id="selectionHint">Seleccioná un tema para continuar.</p>
      </div>
      <div class="lg:w-72 w-full">
        <h4 class="font-headline font-bold text-sm text-on-surface flex items-center gap-1 mb-3">
          <span class="material-symbols-outlined text-primary text-base">auto_awesome</span>
          Ayuda Rápida
        </h4>
        <ul class="space-y-2">
          <li><a class="group block py-1 border-b border-outline-variant/10 hover:border-primary transition-all" href="#"><span class="text-on-surface-variant group-hover:text-primary transition-colors text-xs font-medium">Política de Cancelación</span></a></li>
          <li><a class="group block py-1 border-b border-outline-variant/10 hover:border-primary transition-all" href="#"><span class="text-on-surface-variant group-hover:text-primary transition-colors text-xs font-medium">Actualizar Verificación de Conductor</span></a></li>
          <li><a class="group block py-1 border-b border-outline-variant/10 hover:border-primary transition-all" href="#"><span class="text-on-surface-variant group-hover:text-primary transition-colors text-xs font-medium">Beneficios para Socios</span></a></li>
        </ul>
      </div>
    </div>

  </div>
</main>

<div id="footer-placeholder" class="ml-64"></div>
<div id="login-modal-placeholder"></div>

<script>
  function selectTopic(element) {
    document.querySelectorAll('.topic-card').forEach(card => {
      card.classList.remove('active-topic', 'ring-4', 'ring-primary/20');
      card.classList.add('bg-surface-container-lowest');
    });

    element.classList.add('active-topic', 'ring-4', 'ring-primary/20');
    element.classList.remove('bg-surface-container-lowest');

    const btn = document.getElementById('startChatBtn');
    btn.disabled = false;
    btn.classList.remove('bg-outline-variant', 'text-on-primary-container', 'opacity-50', 'cursor-not-allowed');
    btn.classList.add('bg-primary', 'text-on-primary', 'hover:opacity-90', 'active:scale-95');

    const topic = element.dataset.topic;
    btn.onclick = () => {
      window.location.href = `/chat/chat_bot.html?topic=${encodeURIComponent(topic)}`;
    };

    const hint = document.getElementById('selectionHint');
    hint.textContent = `Nuestro asistente virtual te ayudará con: ${topic}.`;
    hint.classList.replace('text-secondary', 'text-primary');
  }

  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.topic-card').forEach((card, index) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      setTimeout(() => {
        card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, index * 100);
    });
  });
</script>

<script src="/components/layout_shell.js"></script>
<script src="/components/layout_ui.js"></script>
<script src="/components/layout_profile.js"></script>
<script src="/components/layout_users.js"></script>
<script src="/components/layout_vehicles.js"></script>
<script src="/components/layout.js"></script>
</body>
</html>
